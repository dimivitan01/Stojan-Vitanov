<!doctype html>

  <style>
    :root{--navy:#07162d;--navy2:#0d2a4f;--gold:#d7ad4c;--cream:#f7f3e8;--ink:#152238;--muted:#667085;--royal-red:#9b1b30}
    *{box-sizing:border-box} html{min-height:100%}
    body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 15%,#1b4775 0,transparent 34%),radial-gradient(circle at 85% 85%,#163861 0,transparent 38%),var(--navy)}
    .card{width:min(100%,430px);overflow:hidden;border-radius:28px;background:var(--navy);box-shadow:0 30px 80px #0008;border:2px solid var(--royal-red)}
    .card:before{content:"";position:absolute;z-index:3;top:0;left:0;width:100%;height:5px;background:linear-gradient(90deg,var(--royal-red),#c43b50,var(--gold),#c43b50,var(--royal-red))}\n    .hero{position:relative;padding:42px 30px 36px;text-align:center;color:white;background:linear-gradient(145deg,var(--navy),var(--navy2))}
    .hero:before,.hero:after{content:"";position:absolute;border:1px solid #d7ad4c44;border-radius:50%}
    .hero:before{width:180px;height:180px;top:-90px;right:-70px}.hero:after{width:120px;height:120px;bottom:-72px;left:-60px}
    .logo{display:block;width:min(190px,65%);height:auto;max-height:125px;object-fit:contain;margin:0 auto 22px;filter:drop-shadow(0 8px 18px #0005)}
    h1{width:100%;margin:0;color:#fff;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:34px;line-height:1.08;letter-spacing:.2px}
    .rule{width:52px;height:2px;margin:17px auto;background:var(--gold)}
    .title{width:100%;max-width:330px;margin:auto;color:#e8edf5;text-align:center;font-size:14px;line-height:1.55;letter-spacing:.12em;text-transform:uppercase}
    .body{padding:27px;color:#f4f7fb;background:var(--navy)}
    .contact{display:flex;align-items:center;gap:15px;padding:14px 12px;border-bottom:1px solid #ffffff1f;color:inherit;text-decoration:none;transition:.18s ease}
    .contact:last-of-type{border-bottom:0}.contact:hover{transform:translateX(3px);color:#9b721c}
    .icon{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:13px;background:#d7ad4c20;color:#9b721c}
    .icon svg{width:21px;height:21px}
    .label{display:block;margin-bottom:3px;color:#aebbd0;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    .value{font-size:15px;font-weight:650;overflow-wrap:anywhere}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px}
    .btn{min-height:50px;display:flex;align-items:center;justify-content:center;gap:9px;border:2px solid var(--royal-red);border-radius:14px;font:700 14px inherit;text-decoration:none;cursor:pointer}
    .primary{color:white;background:var(--navy)}.secondary{color:#fff;background:#ffffff0d}
    footer{padding:0 27px 25px;text-align:center;color:#aebbd0;background:var(--navy);font-size:11px;letter-spacing:.08em}
    @media(max-width:390px){body{padding:14px}.hero{padding:35px 22px 30px}h1{font-size:30px}.body{padding:20px}.actions{grid-template-columns:1fr}}
  </style>
</head>
